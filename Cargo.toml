[workspace]
resolver = "3"
members = ["crates/nodriver", "crates/nodriver-cdp", "crates/cdp-gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/arthurbolsoni/nodriver-rs"
rust-version = "1.85"

[workspace.dependencies]
nodriver-cdp = { path = "crates/nodriver-cdp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
